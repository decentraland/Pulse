services:
  dcl-pulse:
    build:
      context: .
      dockerfile: Dockerfile.debug
    container_name: dcl-pulse-debug
    ports:
      - "7777:7777/udp"
      - "7743:7743/udp"
    volumes:
      - ./src:/app/src
    environment:
      DOTNET_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
      Peers__ResyncWithDelta: false
      WebTransport__Enabled: true
      # Cluster derivation is off by default in appsettings; the debug stack turns it on and points
      # it at the sidecar broker so the NATS feed is exercisable locally. Drop Nats__Url to get
      # stats-only mode (tracker runs, nothing published).
      Clusters__Enabled: true
      Nats__Url: nats://nats:4222
    depends_on:
      - nats
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  nats:
    image: nats:2-alpine
    container_name: dcl-pulse-nats
    ports:
      # 4222 client, 8222 HTTP monitoring (/varz, /connz) for confirming the publisher connected.
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
