name: ENet pin watch

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pin:
    name: Compare the rusty_enet pin with dcl-one main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pin with dcl-one main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # On a pull request a finding is a warning, so unrelated work stays green; on schedule
          # and workflow_dispatch it fails the run.
          failed=0
          finding() {
            if [ "$EVENT" = "pull_request" ]; then
              echo "::warning::$1"
            else
              echo "::error::$1"
              failed=1
            fi
          }
          # A lookup that fails leaves nothing to compare: report it and stop.
          lookup_failed() {
            finding "$1"
            exit "$failed"
          }

          pin_file=native/enet/PIN.json
          if [ ! -f "$pin_file" ]; then
            echo "::error::$pin_file is missing"
            exit 1
          fi

          pinned=$(jq -r '.tree_sha' "$pin_file")
          rev=$(jq -r '.rev' "$pin_file")
          path=$(jq -r '.path' "$pin_file")
          name=$(basename "$path")
          if [ -z "$pinned" ] || [ "$pinned" = "null" ]; then
            echo "::error::$pin_file has no tree_sha"
            exit 1
          fi
          if [ -z "$rev" ] || [ "$rev" = "null" ]; then
            echo "::error::$pin_file has no rev"
            exit 1
          fi

          if ! listing=$(gh api "repos/decentraland/dcl-one/contents/library/vendor?ref=main"); then
            lookup_failed "could not read library/vendor on dcl-one main"
          fi
          current=$(jq -r --arg name "$name" '.[] | select(.name == $name and .type == "dir") | .sha' <<<"$listing")
          if [ -z "$current" ]; then
            lookup_failed "dcl-one main has no $name folder under library/vendor"
          fi

          if ! status=$(gh api "repos/decentraland/dcl-one/compare/${rev}...main" --jq '.status'); then
            lookup_failed "could not compare the ENet pin $rev with dcl-one main"
          fi

          echo "pinned rev:    $rev (compare with main: $status)"
          echo "pinned tree:   $pinned"
          echo "current tree:  $current"

          clean=1
          if [ "$status" != "ahead" ] && [ "$status" != "identical" ]; then
            finding "the ENet pin is not a commit on dcl-one's main"
            clean=0
          fi
          if [ "$pinned" != "$current" ]; then
            finding "dcl-one's rusty_enet tree moved; follow \"Moving the ENet pin\" in the README"
            clean=0
          fi
          if [ "$clean" = 1 ]; then
            echo "rusty_enet tree is in sync and the pin is on dcl-one's main"
          fi
          exit "$failed"
